# ============================================================================
# Chatty — production deployment
#   • chatty     : Go app on 0.0.0.0:3333 (LAN + Tailscale)
#   • chatty-db  : PostgreSQL 17, internal Docker network only (no host port)
#
# The app attaches to the EXISTING `mimir_mimir` network to reach the running
# Mimir inference service via the `inference` alias. No second LLM is deployed.
# ============================================================================

services:
  chatty:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatty:latest
    container_name: chatty
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: "3333"
      DATABASE_HOST: chatty-db
      DATABASE_PORT: "5432"
      # Interpolated from .env by Compose so the app and Postgres share one secret.
      DATABASE_PASSWORD: ${CHATTY_DB_PASSWORD:?CHATTY_DB_PASSWORD must be set in .env}
    ports:
      - "3333:3333"
    depends_on:
      chatty-db:
        condition: service_healthy
    networks:
      - chatty
      - mimir_mimir
    healthcheck:
      test: ["CMD", "/chatty", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  chatty-db:
    image: postgres:17-alpine
    container_name: chatty-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-chatty}
      POSTGRES_USER: ${DATABASE_USER:-chatty}
      POSTGRES_PASSWORD: ${CHATTY_DB_PASSWORD:?CHATTY_DB_PASSWORD must be set in .env}
      # Deterministic collation for the 'simple' FTS config.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - chatty-db-data:/var/lib/postgresql/data
    networks:
      - chatty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-chatty} -d ${DATABASE_NAME:-chatty}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  # Private app↔db network. PostgreSQL is reachable ONLY here — never published
  # to the host, so it is not exposed to the LAN/Tailscale.
  chatty:
    driver: bridge
  # Existing Mimir network (created by the Mimir stack). Reused, not recreated.
  mimir_mimir:
    external: true

volumes:
  chatty-db-data:
